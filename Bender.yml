package:
  name: riscv-iommu
  authors:
    - "Manuel Rodríguez <manuel.cederog@gmail.com>"

dependencies:
  axi: { git: https://github.com/pulp-platform/axi.git, rev: 39f5f2d51c5e524f6fc5cf8b6e901f7dcc5622d7 } # version v0.39.6
